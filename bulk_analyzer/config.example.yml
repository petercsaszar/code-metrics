gitlab:
  url: "https://gitlab.com/api/v4"  # GitLab API base URL
  token: "<YOUR_ACCESS_TOKEN>"       # GitLab personal access token (ignored in Docker — use -e GITLAB_TOKEN)
  group_id: "<YOUR_GROUP_ID>"        # Main GitLab group ID
  subgroup_id: ""                     # optional
  milestone_keywords:                # Milestone names to search for
    - ["Prototípus I", "Prototípus 1", "Prototype I", "Prototype 1", "Mérföldkő II", "Mérföldkő 2", "II. Mérföldkő", "2. Mérföldkő"]
    - ["Prototípus II", "Prototípus 2", "Prototype II", "Prototype 2", "Mérföldkő III", "Mérföldkő 3", "III. Mérföldkő", "3. Mérföldkő"]
    - ["Kész termék", "Végleges termék", "Finished", "Mérföldkő IV", "Mérföldkő 4", "Final product", "IV. Mérföldkő", "4. Mérföldkő"]
project:
  clone_dir: "./repos"              # Directory where repositories will be cloned

public_analyzer:
  repository_list: "repos.json"      # List of , public repos to analyze
  clone_dir: "./public_repos"              # Directory where repositories will be cloned
  concurrency: 6                   # Number of parallel container runs
  analysis_mode: "summary"         # summary | method
  output_file: "public_analysis_results.json"

analyzer:
  solution_dir: "../CodeMetricsAnalyzer"  # Base directory of your .NET solution
  project_dir: "../CodeMetricsAnalyzer/CodeMetricsAnalyzer/"  # Directory of the executable project
  msbuild_dir: "C:/Program Files/Microsoft Visual Studio/2022/Community/MSBuild/Current/Bin"
  project_file: "CodeMetricsAnalyzer.csproj"  # The main project file to run
  cloc_path: "cloc" # optional, cloc executable name or full path
  # Note: Unity projects are handled automatically via a built-in Python solution
  # generator — no Unity editor, license, or extra configuration required.

# Optional CodeChecker visualization export for method-level analysis.
# This exports YOUR analyzer findings in CodeChecker-compatible formats.
# It does not run CodeChecker analyzers.
codechecker:
  enabled: false
  export_dir: "../codechecker_reports"     # where exported files are written
  export_plist: true                        # export CodeChecker-compatible plist
  export_json: true                         # export CodeChecker parse-compatible json

docker:
  image: "code-metrics-analyzer"